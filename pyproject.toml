[build-system]
requires = ["poetry-core>=1.0.0,<1.3.0", "setuptools>=65.0"]
build-backend = "poetry.core.masonry.api"

# The following lines were added to enforce the poetry version needed for the project.
# It will be read by the setup_environment.py script to install this version.
[build-system-requirements]
build-system-version = "1.7.0"

[tool.poetry]
name = "ansys-visor-viewer"
version = "1.0.dev0"
description = "\"VISOR 3D visualization web component framework\""
authors = ["VISOR Team <visor@synopsys.com>"]
readme = "README.rst"
license = "Apache-2.0"
repository = "https://github.com/ansys/visor"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
packages = [
    { include = "ansys/visor/viewer", from = "src" },
    { include = "visordash", from = "src/ansys/visor/dash" },
    { include = "ansys/visor/viewer/cli", from = "src"}
]

include = [
    { path = "src/ansys/visor/viewer/client_bundle/**", format = ["sdist", "wheel"] },
    { path = "src/ansys/visor/viewer/dash/visordash/**", format = ["sdist", "wheel"] },
    { path = "src/ansys/visor/viewer/dash/src/lib/**", format = ["sdist", "wheel"] },
    { path = "README.rst", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
visor-setup = "ansys.visor.viewer.utils.autosetup:main"
visor-cli = "ansys.visor.viewer.cli.visor_cli:main"

[tool.poetry.urls]
Bugs = "https://github.com/ansys/visor/issues"
Documentation = "https://github.com/pages/auth?nonce=d0e90489-388e-415e-a0ca-0dc8d2f3c1e3&page_id=60759470&path=L3ZlcnNpb24vZGV2L2luZGV4Lmh0bWw"
Source = "https://github.com/ansys/visor"
Discussions = "https://github.com/ansys/visor/discussions"
Releases = "https://github.com/ansys/visor/releases"
Changelog = "https://github.com/ansys/visor/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = "^3.11"
trame = "3.12.0"
trame-server = "^3.6.0"
wslink = "^2.5.0"
trame-vtklocal = "0.16.4"
vtk = "9.6.1"
fastapi = "^0.136.3"
starlette =  ">=1.3.1"
uvicorn = ">=0.24,<0.25"
pydantic_settings = "<=2.6.0"
requests = "^2.32.0"
dash = ">=2.16.1"
click = ">=8.3.3"
urllib3 = "^2.7.0"
aiohttp = ">=3.14.0"
pillow = ">=12.3.0" # CVE-2026-55380

[[tool.poetry.source]]
name = "vtk-wheels"
url = "https://wheels.vtk.org"
priority = "supplemental"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^3.0.0"
pytest-mock = "^3.14.0"
pytest-trio = "^0.8.0"
pytest-asyncio = "^1.2.0"
httpx = "^0.28.0"
pytest-playwright = "^0.7.2"
pytest-html = "^4.2.0"
nbval = "^0.11.0"
ipykernel = "^7.2.0"
jupyter-client = "^8.8.0"
nbformat = "^5.10.4"
deepdiff = "^8.6.1"

[tool.poetry.group.setup.dependencies]
trame = "3.12.0"
trame-vtklocal = "0.16.4"
vtk = "9.6.1"
# Provides dash-generate-components CLI used by `npm run build:backends`
dash = {version = ">=2.0.0", extras = ["dev"]}

[tool.poetry.group.doc]
optional = true

[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = "^1.1.1"
numpydoc = "1.8.0"
sphinx = "^8.0.2"
sphinx-copybutton = "0.5.2"
sphinx-gallery = "^0.18.0"
sphinx-autodoc-typehints = "*"
sphinxcontrib-openapi = "^0.8.4"
sphinx-design = "^0.6.1"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["E501", "E402"]  # E501: Line too long (formatter job), E402: Module imports (may be intentional)

[tool.towncrier]
package = "ansys.viewer.visor"
directory = "doc/changelog.d"
filename = "doc/source/changelog.rst"
start_string = ".. towncrier release notes start\n"
template = "doc/changelog.d/changelog_template.jinja"
title_format = "`{version} <https://github.com/ansys/visor/releases/tag/v{version}>`_ - {project_date}"
issue_format = "`#{issue} <https://github.com/ansys/visor/pull/{issue}>`_"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "Maintenance"
showcontent = true

[[tool.towncrier.type]]
directory = "miscellaneous"
name = "Miscellaneous"
showcontent = true
[[tool.towncrier.type]]
directory = "test"
name = "Test"
showcontent = true

