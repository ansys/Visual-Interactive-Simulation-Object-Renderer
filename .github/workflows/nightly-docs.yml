name: Nightly Documentation Build

on:
  schedule: # UTC at 23:00 = 7pm EDT
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: [ 'v*' ]

env:
  DOCUMENTATION_CNAME: 'supreme-fiesta-v6v17mm.pages.github.io'
  MAIN_PYTHON_VERSION: '3.11'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs_build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      # Install Xvfb and Mesa for headless OpenGL rendering (needed for VTK and similar libraries)
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1

      # Start Xvfb on display :99 to provide a virtual X server for graphical tests
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      # Run tests with DISPLAY=:99 (for Xvfb) and VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN=1
      # VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN=1 ensures VTK uses offscreen rendering to avoid X errors
      - name: Run Ansys documentation building action
        uses: ansys/actions/doc-build@v10
        env:
          DISPLAY: ":99"  # Use the virtual X server started by Xvfb
          VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN: "1"  # Force VTK to use offscreen rendering
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          check-links: false
          sphinxopts: '-j auto'
          optional-dependencies-name: ""
          group-dependencies-name: "doc"

  docs_upload:
    needs: docs_build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy development documentation
        uses: ansys/actions/doc-deploy-dev@v11.0
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  docs_upload_stable:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    needs: docs_build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy stable documentation
        uses: ansys/actions/doc-deploy-stable@v11.0
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  update_versions_json:
    name: Update versions.json
    needs: docs_upload
    if: needs.docs_upload.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate versions.json
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          BASE_URL = "https://supreme-fiesta-v6v17mm.pages.github.io"
          ROOT = Path(".")

          versions = []

          version_root = ROOT / "version"

          if (version_root / "dev").exists():
              versions.append(
                  {
                      "name": "dev",
                      "version": "dev",
                      "url": f"{BASE_URL}/version/dev/",
                  }
              )

          if (version_root / "stable").exists():
              versions.append(
                  {
                      "name": "stable",
                      "version": "stable",
                      "url": f"{BASE_URL}/version/stable/",
                  }
              )

          if version_root.exists():
              numbered = []
              for child in version_root.iterdir():
                  if not child.is_dir():
                      continue
                  name = child.name
                  if name in {"dev", "stable"}:
                      continue
                  numbered.append(
                      {
                          "name": name,
                          "version": name.removeprefix("v"),
                          "url": f"{BASE_URL}/version/{name}/",
                      }
                  )

              versions.extend(sorted(numbered, key=lambda x: x["name"], reverse=True))

          out = ROOT / "versions.json"
          out.parent.mkdir(parents=True, exist_ok=True)

          with open(out, "w", encoding="utf-8") as f:
              json.dump(versions, f, indent=2)
              f.write("\n")
          PY

      - name: Show versions.json
        run: cat versions.json

      - name: Commit and push versions.json
        shell: bash
        run: |
          git config user.name "${{ secrets.PYANSYS_CI_BOT_USERNAME }}"
          git config user.email "${{ secrets.PYANSYS_CI_BOT_EMAIL }}"
          git add versions.json
          git diff --cached --quiet || git commit -m "docs: update version switcher data"
          git push