name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release/*
  push:
    tags:
      - "v*"
    branches:
      - main
      - release/*

jobs:
  security_scan:
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ansys-internal/ci-templates/.github/workflows/security-scan-mend.yml@v12
    with:
      package_type: 'poetry+npm'
      needs: 'sca,sast,sbom'
      poetry-version: '2.1.3'
    secrets: inherit