[pytest]

markers =
    smoke: mark a test as a smoke test
    regression: mark a test as a regression test
    integration: tests combining multiple components
    unit: isolated tests
    notebook: mark a test that runs a notebook
    saf: public PIM-free SAF integration (requires tests/fixtures/saf_visor_solution and the current Visor wheel)

norecursedirs =
    fixtures
    e2e
    regressions
    smoke
    files
    logs
    notebooks
    reference_images
    __pycache__
